<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Error 404 — PlainBetter</title>

  <meta
    name="robots"
    content="noindex"
  />

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --navy: #183A52;
      --navy-dark: #102B3E;

      --ochre: #D2A13A;
      --ochre-mid: #D5A846;
      --ochre-light: #D8AE52;

      --cream: #F8F1DE;

      --topbar-height: 88px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }

    body {
      font-family:
        "Crimson Pro",
        Georgia,
        serif;

      color: var(--navy);

      background:
        linear-gradient(
          90deg,
          var(--ochre) 0%,
          var(--ochre-mid) 55%,
          var(--ochre-light) 100%
        );
    }


    /* =====================================================
       TOP BAR
       ===================================================== */

    .topbar {
      width: 100%;
      height: var(--topbar-height);

      background: var(--navy);

      box-shadow:
        0 5px 18px rgba(16, 43, 62, .17);
    }


    /* =====================================================
       ERROR AREA
       ===================================================== */

    main {
      height:
        calc(100% - var(--topbar-height));

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;
    }

    .error-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      transform:
        translateY(-4%);
    }

    .error-visual {
      display: flex;
      align-items: flex-end;
      justify-content: center;

      gap:
        clamp(6px, 1.5vw, 22px);
    }


    /* =====================================================
       404
       ===================================================== */

    .error-number {
      margin: 0;

      color: var(--navy);

      font-size:
        clamp(
          7rem,
          17vw,
          14rem
        );

      line-height: .72;

      font-weight: 500;

      letter-spacing: -.055em;

      text-shadow:
        0 7px 3px rgba(16, 43, 62, .08),
        0 15px 17px rgba(16, 43, 62, .13);
    }


    /* =====================================================
       CHARACTER
       ===================================================== */

    .lost-character {
      position: relative;

      width:
        clamp(
          92px,
          11vw,
          150px
        );

      height:
        clamp(
          150px,
          18vw,
          238px
        );

      flex: 0 0 auto;

      margin-bottom:
        -3px;

      filter:
        drop-shadow(
          0 8px 3px rgba(16, 43, 62, .09)
        )
        drop-shadow(
          0 15px 10px rgba(16, 43, 62, .11)
        );
    }

    .lost-character svg {
      display: block;

      width: 100%;
      height: 100%;

      overflow: visible;
    }

    .character-line {
      fill: none;

      stroke: var(--navy-dark);

      stroke-width: 5;

      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .character-head {
      fill: var(--cream);

      stroke: var(--navy-dark);

      stroke-width: 5;
    }

    .character-hand {
      fill: var(--cream);

      stroke: var(--navy-dark);

      stroke-width: 3.5;
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .message {
      margin:
        clamp(28px, 4vh, 42px)
        0
        0;

      color: var(--navy);

      font-size:
        clamp(
          1.35rem,
          2.5vw,
          1.85rem
        );

      line-height: 1.4;

      font-weight: 400;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 820px) {
      :root {
        --topbar-height: 76px;
      }

      .error-visual {
        gap: 4px;
      }

      .lost-character {
        margin-right: -5px;
      }
    }

    @media (max-width: 520px) {
      main {
        padding:
          24px 18px;
      }

      .error-number {
        font-size:
          clamp(
            6rem,
            30vw,
            9rem
          );
      }

      .lost-character {
        width: 78px;
        height: 130px;
      }

      .message {
        margin-top: 28px;

        font-size: 1.25rem;
      }
    }
  </style>
</head>


<body>

  <header class="topbar"></header>


  <main>

    <div class="error-content">

      <div class="error-visual">

        <div
          class="lost-character"
          aria-hidden="true"
        >

          <svg
            viewBox="0 0 100 160"
            xmlns="http://www.w3.org/2000/svg"
          >

            <!-- Head -->

            <circle
              class="character-head"
              cx="52"
              cy="35"
              r="13"
            />


            <!-- Neck -->

            <path
              class="character-line"
              d="
                M52 48
                L52 55
              "
            />


            <!-- Torso -->

            <path
              class="character-line"
              d="
                M52 55
                C50 72 50 88 51 103
              "
            />


            <!--
              Left arm:
              bent outward with hand on hip
            -->

            <path
              class="character-line"
              d="
                M51 63
                C43 66 37 73 35 82
                C39 86 43 90 47 92
              "
            />

            <circle
              class="character-hand"
              cx="47"
              cy="92"
              r="3.8"
            />


            <!--
              Right arm:
              reaches fully upward and over
              to the top of the head
            -->

            <path
              class="character-line"
              d="
                M54 62
                C64 61 70 55 72 47
                C75 36 72 27 66 22
                C62 19 58 18 55 18
              "
            />

            <circle
              class="character-hand"
              cx="55"
              cy="18"
              r="3.8"
            />


            <!-- Scratching fingers -->

            <path
              class="character-line"
              style="stroke-width: 2.4;"
              d="
                M53 15
                L50 11
              "
            />

            <path
              class="character-line"
              style="stroke-width: 2.4;"
              d="
                M56 15
                L56 10
              "
            />

            <path
              class="character-line"
              style="stroke-width: 2.4;"
              d="
                M59 16
                L62 12
              "
            />


            <!-- Legs -->

            <path
              class="character-line"
              d="
                M51 103
                C44 117 41 132 40 148
              "
            />

            <path
              class="character-line"
              d="
                M51 103
                C58 116 62 131 64 148
              "
            />


            <!-- Feet -->

            <path
              class="character-line"
              d="
                M40 148
                C37 151 34 152 31 152
              "
            />

            <path
              class="character-line"
              d="
                M64 148
                C67 151 70 152 73 152
              "
            />

          </svg>

        </div>


        <h1 class="error-number">
          404
        </h1>

      </div>


      <p class="message">
        The page you are looking for cannot be found.
      </p>

    </div>

  </main>

</body>
</html>
