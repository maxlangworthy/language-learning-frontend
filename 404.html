<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Error 404 — PlainBetter</title>

  <meta
    name="robots"
    content="noindex"
  />

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --navy: #183A52;
      --ochre: #D2A13A;
      --ochre-light: #D8AE52;
      --topbar-height: 88px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      font-family:
        "Crimson Pro",
        Georgia,
        serif;

      color: var(--navy);

      background:
        linear-gradient(
          90deg,
          var(--ochre) 0%,
          #D4A644 50%,
          var(--ochre-light) 100%
        );
    }

    .topbar {
      width: 100%;
      height: var(--topbar-height);

      background: var(--navy);

      box-shadow:
        0 5px 18px rgba(16, 43, 62, .17);
    }

    main {
      height:
        calc(100% - var(--topbar-height));

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;
    }

    .error-content {
      transform: translateY(-5%);
    }

    h1 {
      margin: 0;

      color: var(--navy);

      font-size:
        clamp(3.6rem, 8vw, 7rem);

      line-height: .95;

      font-weight: 400;

      letter-spacing: -.04em;
    }

    p {
      margin:
        20px 0 0;

      color: var(--navy);

      font-size:
        clamp(1.35rem, 2.5vw, 1.85rem);

      line-height: 1.4;

      font-weight: 400;
    }

    @media (max-width: 820px) {
      :root {
        --topbar-height: 76px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar"></header>

  <main>

    <div class="error-content">

      <h1>
        Error 404
      </h1>

      <p>
        The page you are looking for cannot be found.
      </p>

    </div>

  </main>

</body>
</html>
